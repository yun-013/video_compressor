# リリース公開時に macOS / Linux 用の GUI パッケージをビルドして添付するワークフロー
#
# 使い方: GitHub Releases でリリースを公開する (gh release create vX.Y.Z ...) と自動で起動し、
#         video-compressor-macos.zip / video-compressor-linux-x86_64.tar.gz がリリースに追加される。
# Windows 版 zip (ffmpeg 同梱) は従来どおり build_exe.ps1 でローカルビルドして添付する。
#
# 注意: macOS 版は静的ビルドの ffmpeg を .app 内に同梱する (インストール不要)。
#       Linux 版には同梱しない (各自 apt 等でインストール。README 参照)。

name: Release builds (macOS / Linux)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "アップロード先のリリースタグ (例: v1.0.4)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .app
        run: |
          python -m pip install pyinstaller tkinterdnd2
          python -m PyInstaller --noconfirm --windowed \
            --name "動画圧縮ツール" --collect-data tkinterdnd2 gui.py

      # 静的ビルドの ffmpeg / ffprobe を .app に同梱する (ユーザーの事前インストール不要に)
      # _find_tool が Contents/MacOS/bin を探すのでそこに配置する
      - name: Bundle static ffmpeg into .app
        run: |
          mkdir -p ffmpeg_dl
          curl -sL --retry 3 --retry-all-errors -o ffmpeg_dl/ffmpeg.zip \
            "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -sL --retry 3 --retry-all-errors -o ffmpeg_dl/ffprobe.zip \
            "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -o ffmpeg_dl/ffmpeg.zip -d ffmpeg_dl
          unzip -o ffmpeg_dl/ffprobe.zip -d ffmpeg_dl
          BIN="dist/動画圧縮ツール.app/Contents/MacOS/bin"
          mkdir -p "$BIN"
          cp ffmpeg_dl/ffmpeg ffmpeg_dl/ffprobe "$BIN/"
          chmod +x "$BIN/ffmpeg" "$BIN/ffprobe"
          # ライセンスは Resources に置く (Contents/MacOS 以下に非コードを置くと codesign が失敗する)
          printf '%s\n' \
            "同梱の ffmpeg / ffprobe は GPL ライセンスのオープンソースソフトウェアです。" \
            "ビルド入手元: https://ffmpeg.martin-riedl.de/" \
            "ソースコード: https://ffmpeg.org/download.html" \
            > "dist/動画圧縮ツール.app/Contents/Resources/FFMPEG_LICENSE.txt"
          # ファイル追加で ad-hoc 署名が壊れるため、同梱バイナリと .app を再署名する
          codesign --force -s - "$BIN/ffmpeg" "$BIN/ffprobe"
          codesign --force -s - "dist/動画圧縮ツール.app"
          # 同梱した ffmpeg が実行できることを確認
          "$BIN/ffmpeg" -version | head -1
          "$BIN/ffprobe" -version | head -1

      - name: Package
        run: ditto -c -k --keepParent "dist/動画圧縮ツール.app" video-compressor-macos.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" video-compressor-macos.zip --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          python3 -m venv venv
          venv/bin/pip install pyinstaller tkinterdnd2

      - name: Build
        run: |
          venv/bin/python -m PyInstaller --noconfirm --onefile --windowed \
            --name video-compressor --collect-data tkinterdnd2 gui.py

      - name: Package
        run: tar -czf video-compressor-linux-x86_64.tar.gz -C dist video-compressor

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" video-compressor-linux-x86_64.tar.gz --clobber
